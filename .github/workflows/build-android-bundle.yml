name: Build Android App Bundle (AAB)

# Release tags must be v<package.json version> (for example v4.4.1); any other tag is rejected
# by the version check below. Tag pushes are not a separate trigger because publishing a
# release already fires `release`, and both would build the same bundle twice.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version_code:
        description: 'Override Android Version Code (optional positive integer, e.g. 40401)'
        required: false
        type: string
      version_name:
        description: 'Android Version Name (optional; must match package.json, e.g. 4.4.1)'
        required: false
        type: string

jobs:
  build-aab:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Determine Android Version Code and Name
        id: versioning
        run: |
          # 1. Determine Version Name
          PACKAGE_VERSION=$(node -p "require('./package.json').version")
          if [ -n "${{ inputs.version_name }}" ]; then
            RAW_NAME="${{ inputs.version_name }}"
          elif [ -n "${{ github.event.release.tag_name }}" ]; then
            RAW_NAME="${{ github.event.release.tag_name }}"
          elif [ "${{ github.ref_type }}" = "tag" ]; then
            RAW_NAME="${{ github.ref_name }}"
          else
            RAW_NAME="$PACKAGE_VERSION"
          fi

          # Strip leading 'v' or 'V'
          CLEAN_VER=$(echo "$RAW_NAME" | sed 's/^[vV]//')

          # Use a packed semantic-version code, so every patch/minor release
          # advances Play's integer version code (for example, 4.2.1 -> 40201).
          if [[ "$CLEAN_VER" =~ ^([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
            FINAL_NAME="$CLEAN_VER"
            MAJOR_NUM="${BASH_REMATCH[1]}"
            MINOR_NUM="${BASH_REMATCH[2]}"
            PATCH_NUM="${BASH_REMATCH[3]}"
          elif [[ "$CLEAN_VER" =~ ^[0-9]+$ ]]; then
            FINAL_NAME="${CLEAN_VER}.0.0"
            MAJOR_NUM="$CLEAN_VER"
            MINOR_NUM="0"
            PATCH_NUM="0"
          else
            echo "Android Version Name must be a semantic version such as $PACKAGE_VERSION."
            exit 1
          fi

          # Never produce an Android artifact whose displayed identity silently
          # diverges from the hosted application built from package.json.
          node scripts/verify-version-match.js "$FINAL_NAME"

          # 2. Determine Version Code (Integer)
          if [ -n "${{ inputs.version_code }}" ]; then
            FINAL_CODE="${{ inputs.version_code }}"
          else
            FINAL_CODE=$((10#$MAJOR_NUM * 10000 + 10#$MINOR_NUM * 100 + 10#$PATCH_NUM))
          fi

          if ! [[ "$FINAL_CODE" =~ ^[1-9][0-9]*$ ]]; then
            echo "Android Version Code must be a positive integer."
            exit 1
          fi

          echo "=========================================="
          echo "Resolved Android Version Code: $FINAL_CODE"
          echo "Resolved Android Version Name: $FINAL_NAME"
          echo "=========================================="

          echo "version_code=$FINAL_CODE" >> $GITHUB_OUTPUT
          echo "version_name=$FINAL_NAME" >> $GITHUB_OUTPUT

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          # The action's default list includes the legacy 'tools' package, which Google
          # has removed from the SDK repository; sdkmanager then exits 1.
          packages: 'platform-tools'

      - name: Validate and Decode Upload Keystore
        run: |
          if [ -z "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" ]; then
            echo "ERROR: ANDROID_KEYSTORE_BASE64 secret is not configured in repository secrets."
            exit 1
          fi
          if [ -z "${{ secrets.WAR_UPLOAD_KEYSTORE_PASSWORD }}" ]; then
            echo "ERROR: WAR_UPLOAD_KEYSTORE_PASSWORD secret is not configured in repository secrets."
            exit 1
          fi
          if [ -z "${{ secrets.WAR_UPLOAD_KEY_PASSWORD }}" ]; then
            echo "ERROR: WAR_UPLOAD_KEY_PASSWORD secret is not configured in repository secrets."
            exit 1
          fi
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 --decode > android/upload-keystore.p12

      - name: Grant Execute Permission for Gradle
        run: chmod +x android/gradlew

      - name: Run Android Unit Tests
        working-directory: ./android
        run: ./gradlew testReleaseUnitTest --stacktrace

      - name: Build Release AAB
        working-directory: ./android
        env:
          WAR_UPLOAD_KEYSTORE_PATH: ${{ github.workspace }}/android/upload-keystore.p12
          WAR_UPLOAD_KEY_ALIAS: ${{ secrets.WAR_UPLOAD_KEY_ALIAS || 'upload' }}
          WAR_UPLOAD_KEYSTORE_PASSWORD: ${{ secrets.WAR_UPLOAD_KEYSTORE_PASSWORD }}
          WAR_UPLOAD_KEY_PASSWORD: ${{ secrets.WAR_UPLOAD_KEY_PASSWORD }}
          APP_VERSION_CODE: ${{ steps.versioning.outputs.version_code }}
          APP_VERSION_NAME: ${{ steps.versioning.outputs.version_name }}
          PLAY_GAMES_PROJECT_ID: ${{ vars.PLAY_GAMES_PROJECT_ID || '334487063631' }}
        run: ./gradlew bundleRelease --stacktrace

      - name: Upload Release AAB and R8 Mapping Artifacts
        uses: actions/upload-artifact@v7
        with:
          name: app-release-aab
          path: |
            android/app/build/outputs/bundle/release/app-release.aab
            android/app/build/outputs/mapping/release/mapping.txt
          retention-days: 14

      - name: Attach AAB and R8 Mapping to GitHub Release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v3
        with:
          files: |
            android/app/build/outputs/bundle/release/app-release.aab
            android/app/build/outputs/mapping/release/mapping.txt
