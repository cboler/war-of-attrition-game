name: Android Checks

# Fast native feedback without signing secrets: unit tests and lint for the TWA wrapper.
on:
  push:
    branches: [ main ]
    paths:
      - 'android/**'
      - '.github/workflows/android-checks.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'android/**'
      - '.github/workflows/android-checks.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android-checks:
    name: Unit tests and lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          # The legacy 'tools' package is gone from the SDK repository.
          packages: 'platform-tools'

      - name: Run unit tests and release lint
        working-directory: ./android
        run: |
          chmod +x gradlew
          ./gradlew testDebugUnitTest testReleaseUnitTest lintRelease --stacktrace

      - name: Upload test and lint reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: android-check-reports
          path: |
            android/app/build/reports/
            android/app/build/test-results/
          retention-days: 7
