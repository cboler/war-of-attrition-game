buildscript {
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.5.2'
    }
}

allprojects {
    repositories {
        google()
        mavenCentral()
        maven { url "$rootDir/vendor/m2repository" }
    }
}

task clean(type: Delete) {
    delete rootProject.buildDir
}
