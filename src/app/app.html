<mat-toolbar color="primary" class="app-toolbar" [class.profile-hand-left]="deckHand() === 'left'">
  <div class="app-title-wrapper">
    <a routerLink="/" class="app-title-link" aria-label="War of Attrition Home">
      <span class="app-title-text">{{ title() }}</span>
    </a>
  </div>
  <span class="toolbar-spacer"></span>

  <button
    mat-button
    class="profile-toolbar-btn"
    (click)="openProfileDialog()"
    [attr.aria-label]="profileButtonLabel()"
    matTooltip="Profile">
    <span class="profile-avatar" aria-hidden="true">
      <img [src]="activeProfile().avatarUrl" alt="" />
    </span>
    <span class="profile-name-text">{{ activeProfile().name }}</span>
  </button>
</mat-toolbar>

<main class="app-content">
  <router-outlet />
</main>
