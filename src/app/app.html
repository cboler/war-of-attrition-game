<mat-toolbar color="primary" class="app-toolbar">
  <span>{{ title() }}</span>
  <span class="toolbar-spacer"></span>
  <nav class="nav-links">
    <button mat-icon-button routerLink="/" routerLinkActive="active" [routerLinkActiveOptions]="{exact: true}" aria-label="Card table" matTooltip="Card Table">
      <mat-icon>style</mat-icon>
    </button>
    <button mat-icon-button routerLink="/classic" routerLinkActive="active" aria-label="Classic game" matTooltip="Classic Game">
      <mat-icon>history</mat-icon>
    </button>
    <button mat-icon-button routerLink="/settings" routerLinkActive="active" aria-label="Settings" matTooltip="Settings & Statistics">
      <mat-icon>settings</mat-icon>
    </button>
  </nav>
  
  <button mat-button class="profile-toolbar-btn" (click)="openProfileDialog()" matTooltip="User Profile & Career Records">
    <div class="avatar-badge">
      <img [src]="activeProfile().avatarUrl" [alt]="activeProfile().name" />
      <span class="provider-indicator" [class.google]="activeProfile().isGoogleAuth"></span>
    </div>
    <span class="profile-name-text">{{ activeProfile().name }}</span>
  </button>
</mat-toolbar>

<main class="app-content">
  <router-outlet />
</main>
