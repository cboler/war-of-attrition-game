<mat-toolbar color="primary" class="app-toolbar">
  <div class="app-title-wrapper" (click)="$event.stopPropagation()">
    <button type="button" class="app-title-btn" (click)="toggleRestartConfirm($event)" aria-haspopup="dialog" [attr.aria-expanded]="showRestartConfirm()" aria-label="Game title, click to restart game">
      <span class="app-title-text">{{ title() }}</span>
      <mat-icon class="restart-hint-icon">restart_alt</mat-icon>
    </button>

    @if (showRestartConfirm()) {
      <div class="restart-callout" role="dialog" aria-modal="true" aria-label="Restart Game Confirmation">
        <div class="callout-header">
          <strong>Start New Game?</strong>
        </div>
        <p class="callout-desc">Reset the table and begin a fresh match.</p>
        <div class="callout-actions">
          <button type="button" class="callout-btn secondary" (click)="cancelRestart()">Cancel</button>
          <button type="button" class="callout-btn primary" (click)="confirmRestart()">New Game</button>
        </div>
      </div>
    }
  </div>
  <span class="toolbar-spacer"></span>

  <button mat-button class="profile-toolbar-btn" (click)="openProfileDialog()" aria-label="Open profile, career records, achievements, and settings" matTooltip="Profile & Settings">
    <div class="avatar-badge">
      <img [src]="activeProfile().avatarUrl" [alt]="activeProfile().name" />
      <span class="provider-indicator" [class.google]="activeProfile().isGoogleAuth"></span>
      <mat-icon class="profile-settings-icon" aria-hidden="true">settings</mat-icon>
    </div>
    <span class="profile-name-text">{{ activeProfile().name }}</span>
  </button>
</mat-toolbar>

<main class="app-content">
  <router-outlet />
</main>
